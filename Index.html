<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova - Compagnon Virtuel Évolutif</title>
    <style>
        :root {
            --bg-primary: #090d16;
            --bg-card: rgba(30, 41, 59, 0.7);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(129, 140, 248, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .nova-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stage-badge {
            font-size: 0.7rem;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            text-transform: uppercase;
            font-weight: 600;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            background: rgba(15, 23, 42, 0.5);
            padding: 12px;
            border-radius: 18px;
            border: 1px solid var(--border);
        }

        .stat-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .bar-bg {
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .viewport {
            height: 200px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            border-radius: 20px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        canvas { display: block; }

        .speech-bubble {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 16px;
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #e2e8f0;
            position: relative;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .action-btn {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 4px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.3);
            transform: translateY(-2px);
        }

        .action-btn span { font-size: 1.2rem; }

        .chat-input-area { display: flex; gap: 8px; }

        input[type="text"] {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 16px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus { border-color: var(--accent); }

        .send-btn {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 14px;
            padding: 0 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .send-btn:hover { opacity: 0.9; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-card h3 { color: var(--accent); }

        .modal-btn {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-panel">
        <div class="nova-title" id="nova-name-display">✨ Nova</div>
        <div class="stage-badge" id="stage-badge">Stade 0 : Œuf</div>
    </div>

    <div class="stats-container">
        <div class="stat-group">
            <div class="stat-header"><span>Faim</span><span id="val-hunger">100%</span></div>
            <div class="bar-bg"><div class="bar-fill" id="bar-hunger" style="width: 100%;"></div></div>
        </div>
        <div class="stat-group">
            <div class="stat-header"><span>Énergie</span><span id="val-energy">100%</span></div>
            <div class="bar-bg"><div class="bar-fill" id="bar-energy" style="width: 100%;"></div></div>
        </div>
        <div class="stat-group">
            <div class="stat-header"><span>Bonheur</span><span id="val-happiness">100%</span></div>
            <div class="bar-bg"><div class="bar-fill" id="bar-happiness" style="width: 100%;"></div></div>
        </div>
        <div class="stat-group">
            <div class="stat-header"><span>Expérience</span><span id="val-exp">0 XP</span></div>
            <div class="bar-bg"><div class="bar-fill" id="bar-exp" style="width: 0%;"></div></div>
        </div>
    </div>

    <div class="viewport" id="viewport" onclick="interactPet()">
        <canvas id="creatureCanvas" width="300" height="200"></canvas>
    </div>

    <div class="speech-bubble" id="speech-bubble">
        ... (Bip boop ? Clique sur moi ou discute avec moi pour m'éveiller !)
    </div>

    <div class="actions-grid">
        <button class="action-btn" onclick="feedPet()"><span>🍎</span>Nourrir</button>
        <button class="action-btn" onclick="playPet()"><span>🎾</span>Jouer</button>
        <button class="action-btn" onclick="sleepPet()"><span>💤</span>Dormir</button>
        <button class="action-btn" onclick="cleanPet()"><span>✨</span>Soigner</button>
    </div>

    <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Parle à Nova ou enseigne-lui un mot..." onkeypress="handleKey(event)">
        <button class="send-btn" onclick="sendChat()">Envoyer</button>
    </div>
</div>

<div class="modal-overlay" id="absence-modal">
    <div class="modal-card">
        <h3>👋 Bon retour !</h3>
        <p id="absence-msg">Nova a pensé à vous pendant votre absence...</p>
        <button class="modal-btn" onclick="closeModal()">Continuer</button>
    </div>
</div>

<script>
    // --- État Global ---
    let state = {
        name: "Nova",
        stage: 0,
        evolutionPath: 'balanced',
        hunger: 100,
        energy: 100,
        happiness: 100,
        exp: 0,
        maxExp: 50,
        lastSaved: Date.now(),
        learnedWords: {},
        interactionsCount: 0,
        isSleeping: false,
        pendingWord: null
    };

    const SAVE_KEY = "nova_tamagotchi_save_v2";

    function saveGame() {
        try {
            state.lastSaved = Date.now();
            localStorage.setItem(SAVE_KEY, JSON.stringify(state));
        } catch (e) {
            console.warn("Impossible de sauvegarder", e);
        }
    }

    function loadGame() {
        const saved = localStorage.getItem(SAVE_KEY);
        if (saved) {
            try {
                const loadedState = JSON.parse(saved);
                const now = Date.now();
                const elapsedSeconds = Math.floor((now - (loadedState.lastSaved || now)) / 1000);
                
                state = { ...state, ...loadedState };

                if (elapsedSeconds > 30) {
                    processOfflineProgress(elapsedSeconds);
                }
            } catch (e) {
                console.error("Erreur chargement sauvegarde", e);
            }
        }
        updateStageUI();
        updateUI();
    }

    function processOfflineProgress(seconds) {
        const decayMinutes = Math.floor(seconds / 60);
        const hungerLoss = Math.min(state.hunger, decayMinutes * 0.5);
        const energyLoss = Math.min(state.energy, decayMinutes * 0.3);
        const happyLoss = Math.min(state.happiness, decayMinutes * 0.4);

        state.hunger = Math.max(0, state.hunger - hungerLoss);
        state.energy = Math.max(0, state.energy - energyLoss);
        state.happiness = Math.max(0, state.happiness - happyLoss);

        showModal(`Pendant votre absence (${Math.floor(seconds / 60)} min), Nova a baissé un peu sa garde mais a gardé un œil sur ses souvenirs !`);
    }

    function showModal(text) {
        document.getElementById('absence-msg').innerText = text;
        document.getElementById('absence-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('absence-modal').style.display = 'none';
    }

    // --- Évolution ---
    function addExp(amount) {
        state.exp += amount;
        state.interactionsCount++;

        if (state.stage === 0 && state.exp >= 30) {
            evolveTo(1, "Bébé Neura");
        } else if (state.stage === 1 && state.exp >= 120) {
            determineEvolutionPath();
            evolveTo(2, getEvolutionName());
        } else if (state.stage === 2 && state.exp >= 350) {
            evolveTo(3, "Nova Suprême (Forme Finale)");
        }

        if (state.exp >= state.maxExp && state.stage < 3) {
            state.maxExp = Math.floor(state.maxExp * 1.5);
        }
        updateUI();
        saveGame();
    }

    function evolveTo(newStage, stageTitle) {
        state.stage = newStage;
        updateStageUI();
        say(`✨ Incroyable ! Je me métamorphose et j'évolue vers le stade ${newStage} (${stageTitle}) grâce à nos interactions !`);
        triggerEvolutionFlash();
    }

    function updateStageUI() {
        const badge = document.getElementById('stage-badge');
        const titles = {
            0: "Œuf",
            1: "Bébé Neura",
            2: getEvolutionName(),
            3: "Nova Suprême (Forme Finale)"
        };
        badge.innerText = `Stade ${state.stage} : ${titles[state.stage] || "Inconnu"}`;
        document.getElementById('nova-name-display').innerText = `✨ ${state.name}`;
    }

    function determineEvolutionPath() {
        if (state.happiness > 80) state.evolutionPath = 'wing';
        else if (Object.keys(state.learnedWords).length > 5) state.evolutionPath = 'crystal';
        else state.evolutionPath = 'balanced';
    }

    function getEvolutionName() {
        switch(state.evolutionPath) {
            case 'crystal': return "Aether Cristallin";
            case 'wing': return "Lumion Ailé";
            default: return "Nova Évolué";
        }
    }

    // --- Canvas ---
    const canvas = document.getElementById('creatureCanvas');
    const ctx = canvas.getContext('2d');
    let animFrame = 0;
    let particles = [];

    // Polyfill simple pour roundRect (compatibilité)
    function drawRoundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function triggerEvolutionFlash() {
        for (let i = 0; i < 50; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 2,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                radius: Math.random() * 4 + 2,
                color: '#38bdf8',
                alpha: 1
            });
        }
    }

    function drawCreature() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        animFrame += 0.04;

        if (Math.random() < 0.15 && !state.isSleeping) {
            particles.push({
                x: canvas.width / 2 + (Math.random() - 0.5) * 80,
                y: canvas.height / 2 + (Math.random() - 0.5) * 80,
                vx: (Math.random() - 0.5) * 0.5,
                vy: -Math.random() * 1 - 0.5,
                radius: Math.random() * 2 + 1,
                color: state.stage === 0 ? '#fbbf24' : '#38bdf8',
                alpha: 0.6
            });
        }

        // Mise à jour des particules (sans splice pendant l'itération)
        particles = particles.filter(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.015;
            if (p.alpha <= 0) return false;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            return true;
        });
        ctx.globalAlpha = 1.0;

        const cx = canvas.width / 2;
        const cy = canvas.height / 2 + Math.sin(animFrame * 2) * (state.isSleeping ? 2 : 6);

        ctx.save();
        if (state.isSleeping) ctx.globalAlpha = 0.65;

        if (state.stage === 0) {
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.ellipse(cx, cy, 48, 60, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 3;
            ctx.stroke();
        } else if (state.stage === 1) {
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(cx, cy, 50, 0, Math.PI * 2);
            ctx.fill();
            drawEyes(cx, cy, state.isSleeping);
        } else if (state.stage === 2) {
            ctx.fillStyle = state.evolutionPath === 'crystal' ? '#c084fc' : 
                           state.evolutionPath === 'wing' ? '#22d3ee' : '#38bdf8';
            drawRoundRect(cx - 50, cy - 42, 100, 84, 22);
            ctx.fill();
            drawEyes(cx, cy - 5, state.isSleeping);
        } else {
            ctx.fillStyle = '#818cf8';
            ctx.beginPath();
            ctx.arc(cx, cy, 55, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(cx, cy, 65, 20, animFrame, 0, Math.PI * 2);
            ctx.stroke();
            drawEyes(cx, cy, state.isSleeping);
        }

        ctx.restore();

        if (state.isSleeping) {
            ctx.fillStyle = '#e2e8f0';
            ctx.font = '20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('💤', cx + 40, cy - 40);
        }

        requestAnimationFrame(drawCreature);
    }

    function drawEyes(cx, cy, sleeping) {
        if (sleeping) {
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx - 16, cy - 2);
            ctx.lineTo(cx - 8, cy - 2);
            ctx.moveTo(cx + 8, cy - 2);
            ctx.lineTo(cx + 16, cy - 2);
            ctx.stroke();
        } else {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(cx - 14, cy - 6, 6, 10);
            ctx.fillRect(cx + 8, cy - 6, 6, 10);
        }
    }

    // --- Actions ---
    function interactPet() {
        if (state.isSleeping) {
            say("Zzz... Nova dort encore...");
            return;
        }
        state.happiness = Math.min(100, state.happiness + 3);
        addExp(2);
        say("❤️ Merci pour cette délicate attention ! Je me sens aimé.");
        updateUI();
    }

    function feedPet() {
        if (state.isSleeping) { say("Chut... Nova dort."); return; }
        if (state.hunger >= 100) {
            say("Je n'ai plus faim pour le moment !");
            return;
        }
        state.hunger = Math.min(100, state.hunger + 25);
        addExp(5);
        say("Miam ! Délicieux repas, merci ! 🍎");
        updateUI();
        saveGame();
    }

    function playPet() {
        if (state.isSleeping) { say("Zzz... pas maintenant."); return; }
        if (state.energy < 15) {
            say("Je suis trop fatigué pour jouer... Laisse-moi dormir un peu 💤");
            return;
        }
        state.energy = Math.max(0, state.energy - 15);
        state.happiness = Math.min(100, state.happiness + 20);
        addExp(10);
        say("C'était super amusant ! On s'amuse bien ensemble 🎾");
        updateUI();
        saveGame();
    }

    function sleepPet() {
        state.isSleeping = !state.isSleeping;
        if (state.isSleeping) {
            say("Chut... Nova s'endort pour recharger ses batteries. 🌙");
        } else {
            say("Bonjour ! Je suis de nouveau réveillé et en pleine forme ! ☀️");
        }
        updateUI();
        saveGame();
    }

    function cleanPet() {
        if (state.isSleeping) { say("Zzz..."); return; }
        state.happiness = Math.min(100, state.happiness + 10);
        addExp(5);
        say("Tout propre et étincelant ! ✨ Merci de prendre soin de moi.");
        updateUI();
        saveGame();
    }

    // --- Dialogue & Apprentissage ---
    function say(text) {
        document.getElementById('speech-bubble').innerText = text;
    }

    function sendChat() {
        const inputEl = document.getElementById('chat-input');
        const text = inputEl.value.trim();
        if (!text) return;
        processChatInput(text);
        inputEl.value = '';
    }

    function handleKey(e) {
        if (e.key === 'Enter') sendChat();
    }

    function processChatInput(text) {
        const lower = text.toLowerCase();
        let reply = "";

        // Enseignement d'un mot en attente
        if (state.pendingWord) {
            state.learnedWords[state.pendingWord] = text;
            reply = `Compris ! "${state.pendingWord}" c'est : ${text}. Merci de m'avoir enseigné ça !`;
            state.pendingWord = null;
            addExp(8);
            say(reply);
            updateUI();
            saveGame();
            return;
        }

        if (lower.includes("je m'appelle") || lower.includes("mon nom est")) {
            const match = text.match(/(?:je m'appelle|mon nom est)\s+(.+)/i);
            const name = match ? match[1].trim().split(/\s+/)[0] : text.split(" ").pop();
            reply = `Enchanté ${name} ! J'ai enregistré ton nom dans ma mémoire.`;
            addExp(8);
        } else if (lower.includes("qu'est-ce que") || lower.includes("c'est quoi") || lower.includes("que signifie")) {
            const word = lower
                .replace(/qu'est-ce que|c'est quoi|que signifie|\?|le |la |les |un |une /gi, "")
                .trim();
            if (state.learnedWords[word]) {
                reply = `Je m'en souviens : ${word}, c'est ${state.learnedWords[word]}`;
            } else if (word) {
                reply = `Je ne connais pas encore "${word}". Explique-moi ce que c'est !`;
                state.pendingWord = word;
            } else {
                reply = "De quel mot parles-tu ?";
            }
            addExp(5);
        } else if (/\b(c'est|est un|est une|signifie)\b/i.test(text) && Object.keys(state.learnedWords).length > 0) {
            // Tentative simple d'apprentissage direct
            reply = "Intéressant ! Dis-moi plutôt « qu'est-ce que [mot] » puis explique-le-moi.";
            addExp(3);
        } else {
            const responses = [
                "C'est fascinant ! Dis-m'en plus pour que je progresse.",
                "J'analyse tes mots... Mon intelligence grandit à tes côtés !",
                "J'adore discuter avec toi, ça me donne plein d'énergie !",
                "Chaque discussion avec toi m'aide à évoluer vers de nouveaux stades !"
            ];
            reply = responses[Math.floor(Math.random() * responses.length)];
            addExp(3);
        }

        say(reply);
        updateUI();
        saveGame();
    }

    // --- UI ---
    function updateUI() {
        document.getElementById('bar-hunger').style.width = state.hunger + '%';
        document.getElementById('val-hunger').innerText = Math.round(state.hunger) + '%';
        
        document.getElementById('bar-energy').style.width = state.energy + '%';
        document.getElementById('val-energy').innerText = Math.round(state.energy) + '%';
        
        document.getElementById('bar-happiness').style.width = state.happiness + '%';
        document.getElementById('val-happiness').innerText = Math.round(state.happiness) + '%';
        
        const expPct = Math.min(100, (state.exp / state.maxExp) * 100);
        document.getElementById('bar-exp').style.width = expPct + '%';
        document.getElementById('val-exp').innerText = `${Math.round(state.exp)} XP`;
    }

    // --- Boucle temps réel ---
    setInterval(() => {
        if (!state.isSleeping) {
            state.hunger = Math.max(0, state.hunger - 0.15);
            state.energy = Math.max(0, state.energy - 0.10);
            state.happiness = Math.max(0, state.happiness - 0.12);
        } else {
            state.energy = Math.min(100, state.energy + 0.5);
        }
        updateUI();
        if (Math.random() < 0.3) saveGame(); // Sauvegarde moins fréquente
    }, 10000);

    // Lancement
    try {
        loadGame();
        drawCreature();
        console.log("Nova canvas démarré");
    } catch (err) {
        console.error("Erreur Nova:", err);
        const bubble = document.getElementById('speech-bubble');
        if (bubble) bubble.innerText = "Erreur de dessin : " + err.message;
    }
</script>
</body>
</html>
